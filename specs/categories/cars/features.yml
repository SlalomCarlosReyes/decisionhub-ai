      - "Apple CarPlay"
      - "Android Auto"
      - "Wireless Charging"
      - "Premium Audio System"
      - "Navigation System"
      - "Touchscreen Display"
      - "Digital Instrument Cluster"
      - "Head-Up Display"
      - "Voice Control"
      - "Smartphone Integration"
  
  comfort:
